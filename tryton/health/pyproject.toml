[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "gnuhealth"
version = "4.9.0a1"
description = "GNU Health HIS: Hospital and Health Information System"
requires-python = ">=3.10,<3.13"
readme = "README.rst"
authors = [
    {name = "GNU Solidario", email = "info@gnusolidario.org"},
]
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Environment :: Plugins',
    'Framework :: Tryton',
    'Intended Audience :: Developers',
    'Intended Audience :: Healthcare Industry',
    'License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'Topic :: Scientific/Engineering :: Medical Science Apps.',
]
dependencies = [
    "numpy>=2.1.1,<3",
    'werkzeug>=3.0.4,<4',
    "pillow>=10.4.0,<11",
    'pydot>=3.0.2,<4',
    'bcrypt>=4.2.0,<5',
    'python-magic>=0.4.27,<0.5',
    'pycountry==24.6.1',
    "pytz==2024.2",
    'trytond-company>=7.0,<7.1',
    'trytond-currency>=7.0,<7.1',
    'trytond-party>=7.0,<7.1',
    'trytond-product>=7.0,<7.1'
]

[tool.setuptools]
packages = [
    'trytond.modules.health',
    'trytond.modules.health.tests',
    'trytond.modules.health.wizard',
    'trytond.modules.health.report',
]
package-dir = { 'trytond.modules.health' = '.' }
package-data = { 'trytond.modules.health' = ['data/**/*.xml', 'view/*.xml', 'wizard/*.xml', 'security/*.xml', '*.xml', 'locale/*.po', 'report/*.fodt', 'icons/*.svg', 'tryton.cfg'] }
include-package-data = false
