[project]
name = "gnuhealth"
version = "5.0.0a1"
description = "GNU Health Hospital and Health Information System. Core package"
license = { text = "GPL-3.0-or-later" }
readme = "README.rst"
keywords = ["health", "hospital", "HIS", "eHealth", "gnuhealth"]
requires-python = ">=3.10,<3.14"
authors = [
    {name = "GNU Solidario", email = "info@gnusolidario.org"},
]

dynamic = [ "classifiers" ]

maintainers = [
    { name = "Luis Falcon", email = "falcon@gnuhealth.org" },
    { name = "Gerald Wiese", email = "wiese@gnuhealth.org" },
]

dependencies = [
    "numpy>=2.1.1,<3",
    'werkzeug>=3.0.4,<4',
    "pillow>=10.4.0,<11",
    'pydot>=3.0.2,<4',
    'bcrypt>=4.2.0,<5',
    'python-magic>=0.4.27,<0.5',
    'pycountry==24.6.1',
    "pytz==2024.2",
    'trytond-company>=7.0,<7.1',
    'trytond-currency>=7.0,<7.1',
    'trytond-party>=7.0,<7.1',
    'trytond-product>=7.0,<7.1'
]

[project.urls]
homepage = "https://www.gnuhealth.org"
repository = "https://codeberg.org/gnuhealth/his"
documentation = "https://docs.gnuhealth.org"
"Bug Tracker" = "https://codeberg.org/gnuhealth/his/issues"

[tool-poetry]
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Environment :: Plugins',
    'Framework :: Tryton',
    'Intended Audience :: Developers',
    'Intended Audience :: Healthcare Industry',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'Topic :: Scientific/Engineering :: Medical Science Apps.',
]

packages = [
    { include = 'trytond', from = 'modules', to='health' },
]
