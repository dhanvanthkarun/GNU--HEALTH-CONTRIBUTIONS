[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "gnuhealth-archives"
version = "5.0.0a1"
description = "GNU Health HIS: Hospital and Health Information System"
requires-python = ">=3.10,<3.13"
readme = "README.rst"
authors = [
    {name = "GNU Solidario", email = "info@gnusolidario.org"},
]
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Environment :: Plugins',
    'Framework :: Tryton',
    'Intended Audience :: Developers',
    'Intended Audience :: Healthcare Industry',
    'License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'Topic :: Scientific/Engineering :: Medical Science Apps.',
]
dependencies = [
    # "gnuhealth>=5.0,<5.1"
]

[tool.setuptools]
packages = [
    'trytond.modules.health_archives',
    'trytond.modules.health_archives.tests',
]
package-dir = { 'trytond.modules.health_archives' = '.' }
package-data = { 'trytond.modules.health_archives' = ['view/*.xml', '*.xml', 'locale/*.po', 'icons/*.svg', 'tryton.cfg'] }
include-package-data = false
