# woodpecker syntax: https://woodpecker-ci.org/docs/usage/workflow-syntax

matrix:
  PYTHON_VERSION:
    - 3.10
  MODULE:
    - health
    - health_archives
    - health_nursing
    - health_dentistry
    - health_gyneco
    - health_history
    - health_icd11
    - health_icpm
    - health_imaging
    - health_inpatient
    - health_lab
    - health_lifestyle

steps:
  - name: his-tests-sqlite
    image: python:${PYTHON_VERSION}
    environment:
      DB_CACHE: /tmp/cache
    commands:
      - pip install tryton/health*
      - python -m unittest discover -vv trytond.modules.${MODULE}
    when:
      - path: 'tryton/${MODULE}/*'
